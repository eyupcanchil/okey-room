<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>101 Okey Lobi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="lobby-container">
    <h1>101 Okey Lobi</h1>
    <div class="lobby-buttons">
      <button onclick="masaAcModalGoster()" class="btn-masa-ac-lobi">Masa Aç</button>
      <button onclick="oyunaGirModalGoster()" class="btn-oyuna-gir-lobi">Oyuna Gir</button>
    </div>
  </div>

  <!-- Masa Aç Modal -->
  <div id="masaAcModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h2>Masa aç</h2>
      <p class="modal-desc">Ayarlarını yap ve sana özel masa kodunu (PIN) al.</p>
      <form id="masaAcForm">
        <div class="input-group full-width">
          <label>MASA ADI</label>
          <input type="text" id="masaAdi" value="Benim Masam" required />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="modalKapat('masaAcModal')">İptal et</button>
          <button type="submit" class="btn-submit">Masa aç</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Oyuna Gir Modal (Kod Sorma) -->
  <div id="oyunaGirModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h2>Oyuna Katıl</h2>
      <p class="modal-desc">Arkadaşının sana verdiği 6 haneli masa kodunu gir.</p>
      <form id="oyunaGirForm">
        <div class="input-group full-width">
          <label>MASA KODU (PIN)</label>
          <input type="text" id="masaKoduInput" placeholder="Örn: 123456" required autocomplete="off" maxlength="6" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="modalKapat('oyunaGirModal')">İptal et</button>
          <button type="submit" class="btn-submit">Katıl</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
