<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>101 Okey - Masa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="game-body">

  <!-- Sol Üstte Masa Kodu Bilgisi -->
  <div class="masa-kodu-alani">
    Masa Kodu: <span id="ekranMasaKodu">Bekleniyor...</span>
  </div>

  <div class="masa-container">
    
    <!-- Orta Alan: Bekleme Ekranı -->
    <div class="orta-bekleme">
      <div id="beklemeYazisi">Diğer oyuncular bekleniyor 1/4...</div>
      <button class="btn-davet">Oyuncu davet et</button>
    </div>

    <!-- Üst Koltuk (Boş) -->
    <div class="koltuk ust-koltuk">
      <div class="kutu-cek"></div>
      <div class="bos-yer">
        <span>Boş yer</span><br>Oyuncu davet et
      </div>
      <div class="kutu-at"></div>
    </div>

    <!-- Sol Koltuk (Boş) -->
    <div class="koltuk sol-koltuk">
      <div class="kutu-cek"></div>
      <div class="bos-yer">
        <span>Boş yer</span><br>Oyuncu davet et
      </div>
      <div class="kutu-at"></div>
    </div>

    <!-- Sağ Koltuk (Boş) -->
    <div class="koltuk sag-koltuk">
      <div class="kutu-at"></div>
      <div class="bos-yer">
        <span>Boş yer</span><br>Oyuncu davet et
      </div>
      <div class="kutu-cek"></div>
    </div>

    <!-- Bizim Alanımız (Kullanıcı) -->
    <div class="koltuk alt-koltuk">
      <div class="kutu-cek alt-kutu">Soldan Al</div>
      
      <div class="istaka-alani">
        <div class="istaka-siyah" id="benimIstakam">
          <!-- Taşlar buraya gelecek -->
        </div>
        <div class="istaka-butonlar">
          <button class="btn-dark">Sırala</button>
          <button class="btn-dark">Seri Diz</button>
        </div>
      </div>

      <div class="kutu-at alt-kutu">Sağa At</div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="games.js"></script>
</body>
</html>
