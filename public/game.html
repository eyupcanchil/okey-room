<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>101 Okey - Masa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="game-body">

  <div class="masa-container">
    
    <!-- Üst Oyuncu -->
    <div class="oyuncu-wrapper ust-oyuncu">
      <div class="kutu islem-kutu">Sol (Çek)</div>
      <div class="oyuncu"><div class="avatar">Ahmet</div></div>
      <div class="kutu islem-kutu">Sağ (At)</div>
    </div>

    <!-- Orta Alan (Kalan Taş ve Gösterge) -->
    <div class="orta-alan">
      <div class="tas gosterge-tas" id="gostergeKutusu">?</div>
      <div class="kalan-tas-kutusu">
        <span>Kalan</span>
        <strong id="kalanSayisi">...</strong>
      </div>
    </div>

    <!-- Sol Oyuncu -->
    <div class="oyuncu-wrapper sol-oyuncu">
      <div class="kutu islem-kutu">Sol (Çek)</div>
      <div class="oyuncu"><div class="avatar">Mehmet</div></div>
      <div class="kutu islem-kutu">Sağ (At)</div>
    </div>

    <!-- Sağ Oyuncu -->
    <div class="oyuncu-wrapper sag-oyuncu">
      <div class="kutu islem-kutu">Sağ (At)</div>
      <div class="oyuncu"><div class="avatar">Zeynep</div></div>
      <div class="kutu islem-kutu">Sol (Çek)</div>
    </div>

    <!-- Bizim Alanımız (Alt) -->
    <div class="oyuncu-wrapper alt-oyuncu">
      <div class="kutu islem-kutu">Soldan Al</div>
      <!-- Istaka -->
      <div class="istaka-alani">
        <div class="istaka" id="benimIstakam"></div>
        <div class="istaka-butonlar">
          <button id="btnSirala">Sırala</button>
          <button id="btnTasAt" class="btn-sari">Ortadan Çek</button>
        </div>
      </div>
      <div class="kutu islem-kutu">Sağa At</div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="games.js"></script>
</body>
</html>
