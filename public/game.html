<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>101 Okey - Masa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="game-body">

  <div class="masa-container">
    <!-- Üst Oyuncu -->
    <div class="oyuncu ust-oyuncu">
      <div class="avatar">Ahmet</div>
    </div>

    <!-- Orta Alan (Kalan Taş ve Gösterge) -->
    <div class="orta-alan">
      <div class="tas gosterge-tas" id="gostergeKutusu">?</div>
      <div class="kalan-tas-kutusu">
        <span>Kalan</span>
        <strong id="kalanSayisi">...</strong>
      </div>
    </div>

    <!-- Sol ve Sağ Oyuncular -->
    <div class="oyuncu sol-oyuncu"><div class="avatar">Mehmet</div></div>
    <div class="oyuncu sag-oyuncu"><div class="avatar">Zeynep</div></div>

    <!-- Bizim Istakamız (101 Okey için Genişletilmiş) -->
    <div class="istaka-alani">
      <div class="istaka" id="benimIstakam">
        <!-- Taşlar JavaScript (game.js) ile buraya dizilecek -->
      </div>
      
      <div class="istaka-butonlar">
        <button id="btnSirala">Sırala</button>
        <button id="btnTasAt" class="btn-sari">Taş At</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
