<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>101 Okey - Masa</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body class="game-body">

  <div class="ust-bilgi-bar">
    <div class="bilgi-kutu">Masa Kodu: <span id="ekranMasaKodu">...</span></div>
    <div class="bilgi-kutu">Tur: <span id="ekranTurSayisi">-/-</span></div>
    <button class="kupa-btn" title="Skor Tablosu">🏆</button>
  </div>

  <div class="masa-container">
    
    <div class="orta-bekleme" id="beklemeAlani">
      <div id="beklemeYazisi">Diğer oyuncular bekleniyor 1/4...</div>
      <button class="btn-davet">Oyuncu davet et</button>
    </div>

    <!-- Ortadaki Taşlar ve Gösterge -->
    <div class="ortadaki-taslar" id="ortadakiTaslarAlani" style="display: none;">
      <div class="tas" id="gostergeTasi"></div>
      <div class="kalan-tas-kutusu">
        <span>Kalan</span>
        <strong id="kalanTasSayisi">0</strong>
      </div>
    </div>

    <div class="ortak-kutu kose-sol-ust">Çek / At</div>
    <div class="ortak-kutu kose-sag-ust">Çek / At</div>
    <div class="ortak-kutu kose-sol-alt">Çek / At</div>
    <div class="ortak-kutu kose-sag-alt">Çek / At</div>

    <div class="koltuk ust-koltuk"><div class="bos-yer"><span>Boş yer</span><br>Oyuncu davet et</div></div>
    <div class="koltuk sol-koltuk"><div class="bos-yer"><span>Boş yer</span><br>Oyuncu davet et</div></div>
    <div class="koltuk sag-koltuk"><div class="bos-yer"><span>Boş yer</span><br>Oyuncu davet et</div></div>

    <!-- Bizim Alanımız (Kullanıcı) -->
    <div class="koltuk alt-koltuk">
      <div class="istaka-alani">
        
        <div class="el-degeri-gostergesi" id="elDegeriGostergesi" style="display: none;">101 / 0</div>
        
        <!-- ISTAKA ARTIK ÜST VE ALT DİYE 2 SATIR -->
        <div class="istaka-siyah" id="benimIstakam">
          <div class="istaka-satir" id="istakaUst"></div>
          <div class="istaka-satir" id="istakaAlt"></div>
        </div>
        
        <div class="istaka-butonlar">
          <div class="dropdown">
            <button class="btn-dark dropdown-btn" id="seciliSiralama">Sırala</button>
            <div class="dropdown-icerik">
              <a href="#" onclick="siralaPer()">Per (Seri)</a>
              <a href="#" onclick="siralaCift()">Çift</a>
            </div>
          </div>
          <button class="btn-dark" id="btnTasAc">Taş Aç</button>
        </div>

      </div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="games.js"></script>
</body>
</html>
