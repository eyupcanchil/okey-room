<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>101 Okey - Masa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="game-body">

  <!-- Üst Bilgi Barı -->
  <div class="ust-bilgi-bar">
    <div class="bilgi-kutu">Masa: <span id="ekranMasaKodu">...</span></div>
    <div class="bilgi-kutu">Tur: <span id="ekranTurSayisi">1/1</span></div>
    <button class="kupa-btn" title="Skor Tablosu">🏆</button>
  </div>

  <div class="masa-container">
    
    <!-- Bekleme Ekranı -->
    <div class="orta-bekleme" id="beklemeAlani">
      <div id="beklemeYazisi">Diğer oyuncular bekleniyor (1/4)...</div>
      <div class="bekleme-butonlar">
        <button class="btn-davet" id="btnDavetEt">Kodu Kopyala</button>
        <button class="btn-bot-baslat" id="btnBotTestBaslat">Botlarla Başlat</button>
      </div>
    </div>

    <!-- MASA ORTASI: AÇILAN TAŞLAR ALANI (FOTOĞRAF 2 GİBİ SERİLER VE ÇİFTLER) -->
    <div class="masa-acilan-alan" id="masaAcilanAlan">
      <!-- Sol Taraf: Açılan Seri Perler -->
      <div class="acilan-seriler-kolon" id="acilanSerilerKolon"></div>
      <!-- Sağ Taraf: Açılan Çiftler -->
      <div class="acilan-ciftler-kolon" id="acilanCiftlerKolon"></div>
    </div>

    <!-- ÜSTTEKİ 2 KÖŞE TAŞ YUVASI -->
    <div class="ortak-kutu kose-sag-ust" id="koseSagUst" title="Sağ Oyuncunun Attığı Taş">
      <div class="kutu-tas-alani" id="kutuSagUstTas"></div>
    </div>

    <div class="ortak-kutu kose-sol-ust" id="koseSolUst" title="Üst Oyuncunun Attığı Taş">
      <div class="kutu-tas-alani" id="kutuSolUstTas"></div>
    </div>

    <!-- 3 ÇEVRESEL KOLTUK (SOL, ÜST, SAĞ) -->
    <div class="koltuk sol-koltuk" id="koltukSol">
      <div class="oyuncu-kart">
        <div class="oyuncu-avatar">👤</div>
        <div class="oyuncu-bilgi">
          <span class="oyuncu-isim">Sol Oyuncu</span>
          <span class="oyuncu-durum">Açmadı</span>
        </div>
        <div class="oyuncu-timer-bar"></div>
      </div>
    </div>

    <div class="koltuk ust-koltuk" id="koltukUst">
      <div class="oyuncu-kart">
        <div class="oyuncu-avatar">👤</div>
        <div class="oyuncu-bilgi">
          <span class="oyuncu-isim">Üst Oyuncu</span>
          <span class="oyuncu-durum">Açmadı</span>
        </div>
        <div class="oyuncu-timer-bar"></div>
      </div>
    </div>

    <div class="koltuk sag-koltuk" id="koltukSag">
      <div class="oyuncu-kart">
        <div class="oyuncu-avatar">👤</div>
        <div class="oyuncu-bilgi">
          <span class="oyuncu-isim">Sağ Oyuncu</span>
          <span class="oyuncu-durum">Açmadı</span>
        </div>
        <div class="oyuncu-timer-bar"></div>
      </div>
    </div>

    <!-- ALT KULLANICI ALANI (SOL ÇEKME + SOL HUD + AHŞAP ISTAKA + SAĞ BANKA + SAĞ ATMA) -->
    <div class="koltuk alt-koltuk" id="koltukAlt">
      <div class="istaka-komple-panel">
        
        <!-- 1. SOL ALT KÖŞE: Yandan Taş Çekme Yuvası -->
        <div class="ortak-kutu kose-sol-alt" id="koseSolAlt" title="Yandan Taş Çek">
          <div class="kutu-tas-alani" id="kutuSolAltTas"></div>
        </div>

        <!-- 2. SOL HUD: SERİLER VE ÇİFTLER PUAN GÖSTERGESİ -->
        <div class="hud-puan-panel">
          <div class="hud-grup">
            <div class="hud-baslik">Seriler</div>
            <div class="hud-deger" id="hudSerilerPuan">0 / 101</div>
          </div>
          <div class="hud-ayrac"></div>
          <div class="hud-grup">
            <div class="hud-baslik">Çiftler</div>
            <div class="hud-deger" id="hudCiftlerSayi">0 / 5</div>
          </div>
          <div class="hud-timer-cubuk-alani" id="saniyeCubuguContainer">
            <div class="saniye-cubugu-bar" id="saniyeCubuguBar"></div>
          </div>
        </div>

        <!-- 3. ANA AHŞAP ISTAKA (28 SLOTLU) -->
        <div class="istaka-ana-govde">
          <div class="istaka-ahsap-tahta" id="benimIstakam">
            <div class="istaka-satir" id="istakaUst"></div>
            <div class="istaka-satir" id="istakaAlt"></div>
          </div>

          <!-- Istaka Butonları -->
          <div class="istaka-butonlar">
            <div class="dropdown">
              <button class="btn-metalik dropdown-btn" id="seciliSiralama">Sırala ▼</button>
              <div class="dropdown-icerik" id="siralamaSecenekleri">
                <a href="#" id="btnSiralaPer">Per</a>
                <a href="#" id="btnSiralaCift">Çift</a>
              </div>
            </div>
            <button class="btn-metalik btn-vurgulu" id="btnTasAc">El Aç</button>
            <button class="btn-metalik btn-tehlike" id="btnTasiGeriKoy" style="display: none;">Taşı Geri Koy</button>
          </div>
        </div>

        <!-- 4. SAĞ HUD: BANKA (KALAN DESTE VE GÖSTERGE TAŞI) -->
        <div class="hud-banka-panel">
          <div class="banka-baslik">Banka</div>
          <div class="banka-taslar">
            <!-- Deste Kalan Sayı Taşı (Yalnızca buraya tıklayınca çekilir) -->
            <div class="tas deste-tasi" id="desteTasiAlani" title="Desteden Taş Çek">
              <span class="deste-sayisi" id="kalanTasSayisi">20</span>
            </div>
            <!-- Gösterge Taşı -->
            <div class="tas gosterge-tasi" id="gostergeTasi" title="Gösterge"></div>
          </div>
        </div>

        <!-- 5. SAĞ ALT KÖŞE: Kendi Taş Atma Yuvan -->
        <div class="ortak-kutu kose-sag-alt" id="koseSagAlt" title="Taş At">
          <div class="kutu-tas-alani" id="kutuSagAltTas"></div>
        </div>

      </div>
    </div>

  </div>

  <div id="toastMesaj" class="toast-mesaj"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="games.js"></script>
</body>
</html>
