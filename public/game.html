<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>101 Okey - Masa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="game-body">

  <!-- Sol Üst Bilgi Barı (Küçültüldü ve Köşeye Alındı) -->
  <div class="ust-bilgi-bar">
    <div class="bilgi-kutu">Masa Kodu: <span id="ekranMasaKodu">...</span></div>
    <div class="bilgi-kutu">Tur: <span id="ekranTurSayisi">-/-</span></div>
    <button class="kupa-btn" title="Skor Tablosu (Yakında)">🏆</button>
  </div>

  <div class="masa-container">
    
    <!-- Orta Alan: Bekleme Ekranı -->
    <div class="orta-bekleme" id="beklemeAlani">
      <div id="beklemeYazisi">Diğer oyuncular bekleniyor 1/4...</div>
      <button class="btn-davet">Oyuncu davet et</button>
    </div>

    <!-- 4 Ortak Taş Kutusu (Köşelerde, Oyunculara Eşit Mesafede) -->
    <div class="ortak-kutu kose-sol-ust"></div>
    <div class="ortak-kutu kose-sag-ust"></div>
    <div class="ortak-kutu kose-sol-alt"></div>
    <div class="ortak-kutu kose-sag-alt"></div>

    <!-- Üst Koltuk (Tam Ortalandı) -->
    <div class="koltuk ust-koltuk">
      <div class="bos-yer"><span>Boş yer</span><br>Oyuncu davet et</div>
    </div>

    <!-- Sol Koltuk (Tam Ortalandı) -->
    <div class="koltuk sol-koltuk">
      <div class="bos-yer"><span>Boş yer</span><br>Oyuncu davet et</div>
    </div>

    <!-- Sağ Koltuk (Tam Ortalandı) -->
    <div class="koltuk sag-koltuk">
      <div class="bos-yer"><span>Boş yer</span><br>Oyuncu davet et</div>
    </div>

    <!-- Bizim Alanımız (Tam Ortalandı) -->
    <div class="koltuk alt-koltuk">
      <div class="istaka-alani">
        <div class="istaka-siyah" id="benimIstakam">
          <!-- Oyun başlayana kadar boş kalacak -->
        </div>
        <div class="istaka-butonlar">
          <button class="btn-dark">Sırala</button>
          <button class="btn-dark">Seri Diz</button>
        </div>
      </div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="games.js"></script>
</body>
</html>
